name: nabapresence-local

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./scripts/load/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${NABAPRESENCE_OTEL_PORT:-9464}:9464"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nabapresence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nabapresence"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrate
      args:
        NODE_IMAGE: ${NABAPRESENCE_NODE_IMAGE:-node:22-alpine}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nabapresence
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nabapresence
    command:
      [
        "sh",
        "-c",
        "node scripts/db-migrate.mjs && RUNTIME_ROLE_NAME=naba_app RUNTIME_ROLE_PASSWORD=naba_app node scripts/db-create-runtime-role.mjs",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
      args:
        NODE_IMAGE: ${NABAPRESENCE_NODE_IMAGE:-node:22-alpine}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://naba_app:naba_app@postgres:5432/nabapresence
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      NEXTAUTH_URL: http://localhost:${NABAPRESENCE_WEB_PORT:-3000}
      NEXTAUTH_SECRET: local-compose-session-secret-at-least-32-characters
      # Read from the shell or the project .env (compose interpolates it) so a
      # database restored from the Supabase snapshot stays decryptable here.
      # The tokens in that snapshot were sealed with the .env key; a fixed
      # compose-only key made every refresh fail with `refresh_failed`.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-local-compose-encryption-key-at-least-32-characters}
      CRON_SECRET: local-compose-cron-secret
      SUPPORT_IMPERSONATION_SECRET: local-compose-support-secret-at-least-32-characters
      DRAFTS_ENABLED: "true"
      PUBLISH_ENABLED: "true"
      SYNC_ENABLED: "true"
      GBP_MEDIA_ENABLED: "true"
      GBP_POSTS_ENABLED: "true"
      GBP_FOOD_MENUS_ENABLED: "true"
      GBP_PLACE_ACTIONS_ENABLED: "true"
      GBP_PROFILE_WRITES_ENABLED: "true"
      GBP_PERFORMANCE_ENABLED: "true"
      GBP_KEYWORDS_ENABLED: "true"
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-false}
      LOCAL_BOOTSTRAP_ENABLED: "true"
      GOOGLE_REQUESTS_PER_SECOND: ${GOOGLE_REQUESTS_PER_SECOND:-8}
      GOOGLE_TIMEOUT_MS: ${GOOGLE_TIMEOUT_MS:-15000}
      GOOGLE_MUTATION_TIMEOUT_MS: ${GOOGLE_MUTATION_TIMEOUT_MS:-20000}
      GOOGLE_API_PROXY_BASE: ${GOOGLE_API_PROXY_BASE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_PUBSUB_AUDIENCE: ${GOOGLE_PUBSUB_AUDIENCE:-}
      GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PUBSUB_VERIFICATION_TOKEN: ${GOOGLE_PUBSUB_VERIFICATION_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_DRAFT: ${OPENAI_MODEL_DRAFT:-gpt-5-mini}
      OPENAI_MODEL_VERIFY: ${OPENAI_MODEL_VERIFY:-gpt-5-mini}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
    ports:
      - "127.0.0.1:${NABAPRESENCE_WEB_PORT:-3000}:3000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/session').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  scheduler:
    build:
      context: .
      target: runtime
      args:
        NODE_IMAGE: ${NABAPRESENCE_NODE_IMAGE:-node:22-alpine}
    command: ["node", "scripts/scheduler.mjs"]
    environment:
      CRON_SECRET: local-compose-cron-secret
      SCHEDULER_BASE_URL: http://web:3000
      RECONCILE_INTERVAL_SECONDS: "900"
      RETENTION_INTERVAL_SECONDS: "86400"
    depends_on:
      web:
        condition: service_healthy
    # Parity with `web` above: the scheduler is an unsupervised singleton, and
    # without this an OOM kill or a bad-config crash stops all seven ticks
    # until someone notices. Liveness itself is the per-tick ops_heartbeat rows
    # the health route reports, not the container, so the healthcheck stays
    # disabled: the process listens on no port to probe.
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  postgres-data:
