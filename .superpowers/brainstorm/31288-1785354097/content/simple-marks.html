<h2>Simpler Local + AI marks</h2>
<p class="subtitle">Fewer shapes. One idea. Click the cleanest one.</p>

<style>
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:8px; }
  .opt { border:1px solid #d1d5db; border-radius:16px; padding:16px; background:#fff; cursor:pointer; text-align:center; transition:border-color .15s, box-shadow .15s; }
  .opt:hover { border-color:#2563EB; box-shadow:0 8px 24px rgba(16,24,40,.08); }
  .opt.selected { border-color:#2563EB; outline:3px solid rgba(37,99,235,.25); }
  .tile { background:#F8FAFC; border-radius:14px; padding:24px 12px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; }
  .name { font-weight:600; font-size:15px; }
  .desc { color:#5F6368; font-size:13px; margin-top:4px; line-height:1.35; }
</style>

<div class="grid options">

  <div class="opt option" data-choice="pin-dot" onclick="toggleSelect(this)">
    <div class="tile">
      <svg viewBox="0 0 100 100" width="120" height="120">
        <path d="M50 8 C68 8 84 24 84 44 C84 66 62 84 50 98 C38 84 16 66 16 44 C16 24 32 8 50 8 Z" fill="#2563EB"/>
        <circle cx="50" cy="42" r="14" fill="#FBBC04"/>
      </svg>
    </div>
    <div class="name">Pin + Core</div>
    <div class="desc">Map pin. One AI core. Nothing else.</div>
  </div>

  <div class="opt option" data-choice="n-spark" onclick="toggleSelect(this)">
    <div class="tile">
      <svg viewBox="0 0 100 100" width="120" height="120">
        <path d="M22 82 V18 H40 L60 58 V18 H78 V82 H60 L40 42 V82 Z" fill="#2563EB"/>
        <circle cx="78" cy="18" r="10" fill="#FBBC04"/>
      </svg>
    </div>
    <div class="name">N + Dot</div>
    <div class="desc">Bold N with one AI accent.</div>
  </div>

  <div class="opt option" data-choice="chat-star" onclick="toggleSelect(this)">
    <div class="tile">
      <svg viewBox="0 0 100 100" width="120" height="120">
        <path d="M18 16 H82 A10 10 0 0 1 92 26 V58 A10 10 0 0 1 82 68 H42 L28 84 V68 H18 A10 10 0 0 1 8 58 V26 A10 10 0 0 1 18 16 Z" fill="#2563EB"/>
        <circle cx="50" cy="42" r="12" fill="#FBBC04"/>
      </svg>
    </div>
    <div class="name">Bubble + Core</div>
    <div class="desc">Reply bubble. One AI core inside.</div>
  </div>

</div>

<p style="margin-top:16px;color:#5F6368;font-size:13px">Pick one — or say what’s still too busy.</p>
