name: Set up pnpm workspace
description: >-
  Install pnpm (version from package.json `packageManager`), Node from .nvmrc,
  and the locked dependencies. Shared by every lane-selected CI job.

inputs:
  cache:
    description: >-
      Package manager to cache with actions/setup-node (`pnpm` on hosted
      runners). Empty on the self-hosted lane, which keeps its store on disk.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No `version:` on purpose: package.json's `packageManager` is the source
    # of truth, and pinning it in both places is a hard error.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
