name: Readiness probe

# The hosted half of the readiness probe (audit W7-3, docs/observability.md
# "Readiness"): every 5 minutes, GET /api/operations/readiness on production
# with scripts/ops/readiness-probe.mjs, so a deployment that is down, failing
# its startup assertion, or not ready is noticed without an operator's laptop
# being awake. A failed run is the alert: GitHub emails the failure of a
# scheduled run to the user who last changed this file's cron, and the run
# list shows the history.
#
# Inert until configured (docs/runbook.md, "Hosted readiness probe"):
#   - repository variable NABA_READINESS_URL: the production origin (https);
#   - repository secret NABA_READINESS_TOKEN: production's CRON_SECRET, the
#     bearer the readiness endpoint accepts;
#   - optional variable NABA_READINESS_EXPECT_PROMOTED=true: also fail when
#     production does not serve the commit of the newest promotion receipt on
#     main (off by default: between `release:promote` and the merge of its
#     receipt, production is legitimately ahead of main).
# GitHub's schedule is best effort and can start runs late under load, and
# each run is billed as at least one minute on this private repository.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: readiness-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production readiness
    if: vars.NABA_READINESS_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The probe, the receipt reader it imports (and its redaction
          # module), and the committed promotion receipts. Cone mode keeps
          # the root .nvmrc.
          sparse-checkout: |
            scripts/ops
            scripts/release
            lib/domain
            docs/release/receipts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Probe
        env:
          READINESS_URL: ${{ vars.NABA_READINESS_URL }}
          READINESS_PROBE_TOKEN: ${{ secrets.NABA_READINESS_TOKEN }}
          EXPECT_PROMOTED: ${{ vars.NABA_READINESS_EXPECT_PROMOTED }}
        run: |
          # Exit 0 ready or degraded; 1 never (no --fail-on-degraded); 2 not
          # ready, unreachable, unauthorised, unreadable or another SHA; 64
          # misconfigured (no token, not https). All non-zero fail the run.
          if [ "$EXPECT_PROMOTED" = true ]; then
            node scripts/ops/readiness-probe.mjs --expect-promoted
          else
            node scripts/ops/readiness-probe.mjs
          fi
