name: Claude PR review

# One review when a pull request opens (or leaves draft, or reopens), then on
# demand only: add the `claude-review` label, or comment `@claude review` as an
# owner, member or collaborator. Pushes to an open PR never start a review.
#
# issue_comment runs always use this file from the default branch and receive
# secrets even when the pull request comes from a fork, so the comment path
# re-checks the pull request itself before anything else runs.
#
# If the Claude GitHub App is ever installed, rename the phrase (for example to
# `/claude-review`) so the app and this workflow do not both answer.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # Secrets are not available to fork or Dependabot PRs, so skip those and
    # drafts. A label on a draft does nothing; the ready_for_review event
    # reviews it anyway.
    if: >-
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'claude-review') &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-level, so that unrelated comments and labels (whose runs skip this
    # job) never cancel a review in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read # check out the pull request
      pull-requests: write # inline review comments, remove the label
      issues: write # summary comment (PR comments are issue comments)
      id-token: write # claude-code-action's OIDC exchange
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Check the pull request (comment trigger)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != issue_comment ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r cross draft author < <(gh pr view "$PR_NUMBER" -R "$REPO" \
            --json isCrossRepository,isDraft,author \
            --jq '"\(.isCrossRepository) \(.isDraft) \(.author.login)"')
          if [ "$cross" = true ] || [ "$draft" = true ] \
            || [ "$author" = dependabot ] || [ "$author" = 'app/dependabot' ]; then
            echo "Skipping review: cross-repo=$cross draft=$draft author=$author"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out pull request
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request checks out the merge ref by default; a comment run
          # would otherwise check out the default branch.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Review with Claude
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post as github-actions[bot] so the Claude GitHub App is not required.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request. Read the repository's AGENTS.md or CLAUDE.md
            first and hold the change to those conventions.

            Focus on real problems, most severe first:
            - Correctness bugs, broken behaviour and unhandled edge cases
            - Security and privacy issues (secrets, input handling, personal data)
            - Accessibility, SEO and performance regressions in user-facing pages
            - Missing or inadequate tests for changed logic

            Leave inline comments only for concrete issues, each with a suggested fix.
            Skip style nitpicks a linter would catch. Finish with one short summary
            comment; if you found nothing worth changing, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Removing the label lets the next `claude-review` label start a new review.
      - name: Remove the claude-review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label claude-review
