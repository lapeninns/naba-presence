name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork or Dependabot PRs, so skip those and drafts.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post as github-actions[bot] so the Claude GitHub App is not required.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the repository's AGENTS.md or CLAUDE.md
            first and hold the change to those conventions.

            Focus on real problems, most severe first:
            - Correctness bugs, broken behaviour and unhandled edge cases
            - Security and privacy issues (secrets, input handling, personal data)
            - Accessibility, SEO and performance regressions in user-facing pages
            - Missing or inadequate tests for changed logic

            Leave inline comments only for concrete issues, each with a suggested fix.
            Skip style nitpicks a linter would catch. Finish with one short summary
            comment; if you found nothing worth changing, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
