name: CI

# Repository Actions are disabled. Enable and qualify this recovery lane only
# through the cutover in docs/engineering/operations.md.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Candidate verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NABA_GATE_INTEGRATION_SHARDS: "2"
      NABA_GATE_E2E_LANES: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate PR merge commit
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
            test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          fi
      - uses: ./.github/actions/setup
      - name: Provision verification tools
        run: |
          bin=$(mktemp -d "$RUNNER_TEMP/naba-tools.XXXXXX")
          install_tool() {
            local tool="$1" repo="$2" tag="$3" asset="$4" sha256="$5"
            curl --fail --silent --show-error --location --retry 2 --max-time 90 \
              "https://github.com/$repo/releases/download/$tag/$asset" -o "$bin/$asset"
            echo "$sha256  $bin/$asset" | sha256sum --check --strict -
            tar -xzf "$bin/$asset" -C "$bin" "$tool"
            test -x "$bin/$tool"
          }
          install_tool actionlint rhysd/actionlint v1.7.12 actionlint_1.7.12_linux_amd64.tar.gz 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          install_tool zizmor zizmorcore/zizmor v1.33.1 zizmor-x86_64-unknown-linux-gnu.tar.gz 3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43
          install_tool gitleaks gitleaks/gitleaks v8.30.1 gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          echo "$bin" >> "$GITHUB_PATH"
      - name: Verify candidate
        env:
          TMPDIR: ${{ runner.temp }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--receipts-dir "$RUNNER_TEMP/naba-candidate-receipts")
          if [ "$EVENT" = pull_request ]; then
            args+=(--merge-candidate --base-ref "$BASE_SHA")
          fi
          node scripts/release/verify-local.mjs "${args[@]}"
      - name: Retain verification receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/naba-candidate-receipts/*.json
          retention-days: 7
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
