name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API; without
  # this it fails with "Resource not accessible by integration".
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # The full gate through e2e runs ~18 minutes, so a 20-minute budget left
    # no headroom for runner variance: the first green pull request took
    # 17m36s and the identical tree was then cancelled mid-e2e on main.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nabareview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://naba_test_runtime:naba_test_runtime@127.0.0.1:5432/nabareview_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nabareview_test
      TEST_RUNTIME_DATABASE_URL: postgresql://naba_test_runtime:naba_test_runtime@127.0.0.1:5432/nabareview_test
      NEXTAUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
      TOKEN_ENCRYPTION_KEY: ci-only-token-key-with-at-least-32-characters
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup@v4 hard-errors when a
      # version is pinned in both places, and package.json's `packageManager`
      # is the one the repo actually installs with.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:runtime-role
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          LOCAL_BOOTSTRAP_ENABLED: "true"
          NEXTAUTH_URL: http://127.0.0.1:3000
          WEBHOOKS_ENABLED: "false"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action needs a token to enumerate a pull request's commits;
      # without it every PR run fails before it scans anything.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
