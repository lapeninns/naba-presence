name: CI

# One required check, `CI result`, aggregates every job below. Jobs may be
# added, split or sharded without touching branch protection.
#
# Lanes: gate/build/migrations/integration/e2e run on the runner chosen by
# `plan` (GitHub-hosted unless vars.SELF_HOSTED_ENABLED == 'true' and the run
# is trusted). The whole build -> integration -> e2e chain moves together
# because the standalone build contains platform-native binaries.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every job and scan the full git history
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Run every job and scan the full git history
        type: boolean
        default: false

permissions: {}

concurrency:
  # github.workflow keeps a nightly (workflow_call) run out of the group of a
  # push run for the same SHA. Pushes to main are never cancelled.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Placeholders only: CI needs no real secrets, so fork and Dependabot pull
  # requests run the full graph.
  NEXTAUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
  TOKEN_ENCRYPTION_KEY: ci-only-token-key-with-at-least-32-characters
  CRON_SECRET: ci-only-cron-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.lane.outputs.runner }}
      lane: ${{ steps.lane.outputs.lane }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Choose runner lane
        id: lane
        env:
          SELF_HOSTED_ENABLED: ${{ vars.SELF_HOSTED_ENABLED }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          trusted=false
          if [ "$SELF_HOSTED_ENABLED" = true ] && [ "$REPO" = lapeninns/naba-presence ]; then
            case "$EVENT" in
              push|schedule|workflow_dispatch)
                [ "$REF" = refs/heads/main ] && trusted=true ;;
              pull_request)
                if [ "$HEAD_REPO" = "$REPO" ] && [ "$PR_AUTHOR" != 'dependabot[bot]' ] \
                  && [ "$ACTOR" != 'dependabot[bot]' ]; then
                  trusted=true
                fi ;;
            esac
          fi
          if [ "$trusted" = true ]; then
            echo 'runner=["self-hosted","macOS","ARM64","naba-trusted"]' >> "$GITHUB_OUTPUT"
            echo 'lane=self-hosted' >> "$GITHUB_OUTPUT"
          else
            echo 'runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo 'lane=hosted' >> "$GITHUB_OUTPUT"
          fi
          echo "Lane: $([ "$trusted" = true ] && echo self-hosted || echo hosted) (event $EVENT)"

      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Only pull requests may skip code jobs; push, schedule, dispatch
          # and workflow_call always run everything.
          if [ "$EVENT" != pull_request ] || [ "$FULL" = true ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              AGENTS.md|*/AGENTS.md) code=true ;;
              .github/*|scripts/*|supabase/*) code=true ;;
              docs/*|*.md) ;;
              *) code=true ;;
            esac
            [ "$code" = true ] && { echo "Code change: $file"; break; }
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code jobs: $code"

  gate:
    # Split three ways: on a 4-vCPU hosted runner the unit suite alone took
    # ~3 minutes, so typecheck + lint + test in one job missed the target.
    name: Gate (${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: [typecheck + lint, unit 1/2, unit 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.lane == 'hosted' && 'pnpm' || '' }}
      - name: Typecheck
        if: matrix.part == 'typecheck + lint'
        run: pnpm typecheck
      - name: Lint
        if: matrix.part == 'typecheck + lint'
        run: pnpm lint
      - name: Unit tests
        if: startsWith(matrix.part, 'unit ')
        env:
          PART: ${{ matrix.part }}
        run: pnpm test --shard="${PART#unit }"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.lane == 'hosted' && 'pnpm' || '' }}
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # `next build` needs no database: every route is dynamic or static
      # without data (verified by building with no DATABASE_URL set).
      - run: pnpm build
      # Tar keeps pnpm's symlinks inside .next/standalone/node_modules, which
      # upload-artifact would flatten. postbuild already copied static/public.
      - name: Pack standalone build
        run: tar -czf standalone.tgz .next/standalone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: standalone.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  migrations:
    name: Migrations
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.lane == 'hosted' && 'pnpm' || '' }}
      - name: Migration policy (append-only history)
        run: node scripts/ci/migration-policy.mjs origin/main
      - run: node scripts/ci/postgres.mjs start
      - name: Migrate from scratch, then re-run as a no-op
        run: |
          pnpm db:migrate
          DB_MIGRATE_EXPECT_NOOP=1 pnpm db:migrate
          pnpm db:runtime-role
          pnpm db:runtime-role
          pnpm db:status
          scripts/ci/pg-client.sh pg_dump --schema-only --no-owner "$DIRECT_DATABASE_URL" > "$RUNNER_TEMP/scratch.sql"
      - name: Upgrade from the merge base matches from scratch
        run: |
          admin="${DIRECT_DATABASE_URL%/*}/postgres"
          scripts/ci/pg-client.sh psql -v ON_ERROR_STOP=1 "$admin" \
            -c 'drop database nabareview_test with (force)' -c 'create database nabareview_test'
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          git archive "$MIGRATION_BASE_SHA" supabase/migrations | tar -x -C "$base"
          echo "::group::Migrate to ${MIGRATION_BASE_SHA:0:12}"
          MIGRATIONS_DIR="$base/supabase/migrations" pnpm db:migrate
          echo "::endgroup::"
          pnpm db:migrate
          pnpm db:runtime-role
          scripts/ci/pg-client.sh pg_dump --schema-only --no-owner "$DIRECT_DATABASE_URL" > "$RUNNER_TEMP/forward.sql"
          # pg_dump 17 writes a random \restrict key on every dump.
          normalize() { grep -vE '^(--|\\restrict|\\unrestrict)' "$1" | sed '/^[[:space:]]*$/d' | sort; }
          if ! diff -u <(normalize "$RUNNER_TEMP/scratch.sql") <(normalize "$RUNNER_TEMP/forward.sql"); then
            echo "::error::Schema after upgrading from the merge base differs from a from-scratch migrate"
            exit 1
          fi
          echo "Upgrade and from-scratch schemas match"
      - name: Concurrent migrate runs serialise on the lock
        run: |
          admin="${DIRECT_DATABASE_URL%/*}/postgres"
          scripts/ci/pg-client.sh psql -v ON_ERROR_STOP=1 "$admin" \
            -c 'drop database nabareview_test with (force)' -c 'create database nabareview_test'
          pnpm db:migrate > "$RUNNER_TEMP/migrate-a.log" 2>&1 & a=$!
          pnpm db:migrate > "$RUNNER_TEMP/migrate-b.log" 2>&1 & b=$!
          status=0
          wait "$a" || status=1
          wait "$b" || status=1
          cat "$RUNNER_TEMP/migrate-a.log" "$RUNNER_TEMP/migrate-b.log"
          [ "$status" = 0 ] || { echo "::error::A concurrent db:migrate failed"; exit 1; }
          expected=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          read -r total distinct < <(scripts/ci/pg-client.sh psql -At -F ' ' "$DIRECT_DATABASE_URL" \
            -c 'select count(*), count(distinct version) from schema_migration')
          echo "files=$expected rows=$total distinct=$distinct"
          [ "$total" = "$expected" ] && [ "$distinct" = "$expected" ] || {
            echo "::error::Expected each of $expected versions exactly once"; exit 1; }
      - name: Stop PostgreSQL
        if: always()
        run: node scripts/ci/postgres.mjs stop

  integration:
    # Two shards, each with its own cluster: one job took ~7.5 minutes of
    # tests and was the critical path.
    name: Integration (shard ${{ matrix.shard }}/2)
    needs: [plan, build]
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.lane == 'hosted' && 'pnpm' || '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
      - name: Unpack standalone build
        run: tar -xzf standalone.tgz && rm standalone.tgz
      - run: node scripts/ci/postgres.mjs start
      - run: pnpm db:migrate
      - run: pnpm db:runtime-role
      - run: pnpm test:integration --shard="$SHARD/2"
      - name: Stop PostgreSQL
        if: always()
        run: node scripts/ci/postgres.mjs stop

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: [plan, build]
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.lane == 'hosted' && 'pnpm' || '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
      - name: Unpack standalone build
        run: tar -xzf standalone.tgz && rm standalone.tgz
      - name: Playwright version
        id: playwright
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "path=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT"
          else
            echo "path=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm exec playwright install chromium
          elif [ "$CACHE_HIT" = true ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - run: node scripts/ci/postgres.mjs start
      - run: node scripts/ci/postgres.mjs ports
      - run: pnpm db:migrate
      - run: pnpm db:runtime-role
      - run: pnpm test:e2e --shard="$SHARD/2"
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop PostgreSQL
        if: always()
        run: node scripts/ci/postgres.mjs stop

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # .gitleaksignore (repo root) lists historical findings by fingerprint.
          range=""
          if [ "$FULL" = true ] || [ "$EVENT" = schedule ]; then
            range=""
          elif [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_BEFORE..$SHA"
          fi
          if [ -n "$range" ]; then
            echo "Scanning $range"
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .
          else
            echo "Scanning full history"
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  result:
    name: CI result
    if: always()
    needs: [plan, gate, build, migrations, integration, e2e, secret-scan, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # skipped counts as a pass: docs-only PRs skip the code jobs, and
          # dependency-review only runs on pull requests.
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi
